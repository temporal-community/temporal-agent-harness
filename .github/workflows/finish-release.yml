name: Release merged PR

# When a release PR (a release/<unit>-v<version> branch from prepare-release.yml) merges: tag the
# merged commit, create the GitHub Release from the PR description, and dispatch the unit's publish
# workflow. GITHUB_TOKEN-created tags and releases trigger no workflows, hence the dispatch.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finish-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # Only execute code from the already merged commit, never an unmerged PR head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag, release and dispatch publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs finish
