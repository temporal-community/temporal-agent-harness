name: Prepare npm release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: choice
        options: [client, react, svelte]
        required: true
      bump:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      client_version:
        description: 'Optional published client version for a binding (e.g. 0.1.1)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: prepare-npm-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # scripts/npm-release.mjs bumps the version with npm and moves a binding's client range with
      # pnpm (`pnpm add --lockfile-only`); action-setup reads typescript/package.json's
      # packageManager.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11

      - name: Prepare version and dependency changes
        id: release
        env:
          RELEASE_PACKAGE: ${{ inputs.package }}
          RELEASE_BUMP: ${{ inputs.bump }}
          CLIENT_VERSION: ${{ inputs.client_version }}
        run: node scripts/npm-release.mjs prepare

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      # main's newest disk cache (tests.yml), for the default interpreter configuration.
      - name: Restore the Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-py313-${{ github.sha }}
          restore-keys: bazel-disk-py313-

      # Builds the tarball publish-npm.yml will publish and runs the package's tests, including the
      # check of the tarball against package.json. The version bump changes package.json, so Bazel
      # also rewrites rules_js's record of it in .aspect/, which the release commit includes.
      - name: Test the proposed release
        run: bazel test "//${{ steps.release.outputs.directory }}/..." --config=ci --disk_cache="$HOME/.cache/bazel-disk"

      - name: Push release branch and show PR creation link
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PACKAGE_DIRECTORY: ${{ steps.release.outputs.directory }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$RELEASE_BRANCH"
          git add "$PACKAGE_DIRECTORY/package.json" typescript/pnpm-lock.yaml .aspect/rules/external_repository_action_cache
          git commit -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_BRANCH"
          node scripts/npm-release.mjs summary
