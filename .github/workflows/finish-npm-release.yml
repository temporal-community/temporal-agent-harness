name: Release merged npm PR

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finish-npm-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/npm-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # Only execute code from the already merged commit, never an unmerged PR head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag merged commit and dispatch publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/npm-release.mjs finish
