name: Publish to PyPI

# Publishes the wheel + sdist to PyPI using a GitHub OIDC trusted publisher — no API token is
# stored anywhere. PyPI verifies that the request came from THIS repo, THIS workflow file, and
# THIS environment, so the three must match the publisher configured at
# https://pypi.org/manage/project/temporal-agent-harness/settings/publishing/ exactly.
#
# Bazel builds both archives (//python:dists), with the browser UI built from typescript/apps/ui/
# in the same invocation, and the tests that gate the upload check those same files.
#
# finish-release.yml dispatches this against the release tag (a bare <version>, which the `pypi`
# environment's tag policy requires) after a release PR merges, having created the GitHub Release
# itself. Rerun it against the same tag to retry; a tag's publication is checked below.

on:
  # Dispatch this against the TAG, not a branch, so the artifacts come from the released commit.
  workflow_dispatch:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    # Must match the environment name given to PyPI's trusted publisher. Also the place to add
    # required reviewers if you want a human gate on every upload.
    environment: pypi
    permissions:
      contents: read
      # Mints the short-lived OIDC token PyPI exchanges for an upload token. Without this the
      # publish step fails with "no OIDC token discovered".
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      # main's newest disk cache for python/ on Python 3.13, the default interpreter (tests.yml).
      - name: Restore the Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-py313-${{ github.sha }}
          restore-keys: bazel-disk-py313-

      # A release is irreversible and a version can never be reused, so gate on the suite, which
      # includes the checks of the archives themselves (tests/test_packaged_distributions.py).
      # Then write those archives out: --config=ci leaves cached outputs in the cache unless asked
      # for them.
      - name: Test and build the wheel and sdist
        run: |
          flags=(--config=ci --disk_cache="$HOME/.cache/bazel-disk")
          bazel test //python/... "${flags[@]}"
          bazel build //python:dists "${flags[@]}" --remote_download_toplevel
          dists="$(bazel info execution_root "${flags[@]}")/$(bazel cquery //python:dists "${flags[@]}" --output=files)"
          # A directory of its own, not a copy of Bazel's read-only one: the publish step writes
          # attestations beside the archives.
          mkdir python/dist
          cp "$dists"/* python/dist/
          ls -l python/dist

      # The tag must be a bare stable version naming the archives built from its commit, or
      # 0.4.0 could ship 0.3.0's code.
      - name: Check the built version matches the release tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != tag ] || ! [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run this against a release tag such as 0.9.0, not ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
            exit 1
          fi
          version="$GITHUB_REF_NAME"
          for dist in "temporal_agent_harness-${version}-py3-none-any.whl" "temporal_agent_harness-${version}.tar.gz"; do
            if [ ! -f "python/dist/${dist}" ]; then
              echo "::error::Release tag ${GITHUB_REF_NAME} has no ${dist}; python/dist holds: $(ls python/dist)"
              exit 1
            fi
          done

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
