name: Publish to npm

on:
  push:
    tags:
      - npm-client-v*
      - npm-svelte-v*
      - npm-react-v*
  # Retry against an existing npm release tag, never a branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the release tag and package
        id: package
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const match = /^npm-(client|svelte|react)-v(\d+\.\d+\.\d+)$/.exec(process.env.GITHUB_REF_NAME);
          assert(process.env.GITHUB_REF_TYPE === 'tag' && match,
            'Select a stable release tag such as npm-client-v0.1.1.');
          const [, pkg, version] = match;
          const directory = `typescript/packages/${pkg}`;
          const manifest = JSON.parse(readFileSync(`${directory}/package.json`, 'utf8'));
          assert.equal(manifest.name, `@temporalio/agent-harness-${pkg}`);
          assert.equal(manifest.version, version, 'Tag must match package.json version');
          assert(!manifest.private, 'Package must be publishable');
          assert.equal(manifest.publishConfig.access, 'public');
          assert.equal(manifest.publishConfig.registry, 'https://registry.npmjs.org/');
          assert.equal(manifest.repository.url,
            `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`);
          for (const value of Object.values(manifest.dependencies ?? {})) {
            assert(!/^(file:|link:|workspace:)/.test(value), 'Publish registry dependencies only');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `directory=${directory}\n`);
          JS

      # OIDC requires npm >=11.5.1; Node 22's bundled npm may be older.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      # main's newest disk cache (tests.yml), for the default interpreter configuration.
      - name: Restore the Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-py313-${{ github.sha }}
          restore-keys: bazel-disk-py313-

      # The package's tests, including the check of its tarball against package.json
      # (bazel/npm_package.bzl), then that same tarball, :pkg_tgz, written out: --config=ci leaves
      # cached outputs in the cache unless asked for them.
      - name: Test and build the package
        id: pack
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
        run: |
          flags=(--config=ci --disk_cache="$HOME/.cache/bazel-disk")
          bazel test "//$PACKAGE_DIRECTORY/..." "${flags[@]}"
          bazel build "//$PACKAGE_DIRECTORY:pkg_tgz" "${flags[@]}" --remote_download_toplevel
          tarball="$(bazel info execution_root "${flags[@]}")/$(bazel cquery "//$PACKAGE_DIRECTORY:pkg_tgz" "${flags[@]}" --output=files)"
          tar -tvzf "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish with OIDC
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance
