name: Publish to npm

# Publishes every public @temporalio/agent-harness* package at the tag's version, in dependency
# order, using npm trusted publishing (OIDC): each package's trusted publisher names THIS repo,
# THIS workflow file and THIS environment, so the three must match. Dispatched by
# finish-release.yml against an npm-v<version> tag; rerun it against the same tag to retry.

on:
  # Retry against an existing release tag, never a branch. finish-release.yml dispatches this.
  workflow_dispatch:
  push:
    tags:
      - npm-v*

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every publishable package is at the tag's version with the metadata provenance needs, and
      # depends on its siblings at exactly that version.
      - name: Validate the release tag and packages
        id: plan
        run: node scripts/release.mjs npm-plan

      # OIDC requires npm >=11.5.1; Node 22's bundled npm may be older.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      # main's newest disk cache for everything outside python/ (tests.yml).
      - name: Restore the Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-other-${{ github.sha }}
          restore-keys: bazel-disk-other-

      # The packages' tests, including the check of each tarball against its package.json
      # (bazel/npm_package.bzl), then those same tarballs, :pkg_tgz, written out: --config=ci
      # leaves cached outputs in the cache unless asked for them.
      - name: Test and build the packages
        env:
          DIRECTORIES: ${{ steps.plan.outputs.directories }}
        run: |
          set -euo pipefail
          flags=(--config=ci --disk_cache="$HOME/.cache/bazel-disk")
          targets=()
          for directory in $DIRECTORIES; do targets+=("//$directory:pkg_tgz"); done
          bazel test //typescript/packages/... "${flags[@]}"
          bazel build "${targets[@]}" "${flags[@]}" --remote_download_toplevel
          root="$(bazel info execution_root "${flags[@]}")"
          mkdir "$RUNNER_TEMP/tarballs"
          for directory in $DIRECTORIES; do
            tarball="$root/$(bazel cquery "//$directory:pkg_tgz" "${flags[@]}" --output=files)"
            cp "$tarball" "$RUNNER_TEMP/tarballs/$(basename "$directory").tgz"
            tar -tvzf "$tarball"
          done

      # In dependency order, so a consumer never sees a binding whose client is not yet published.
      # A package already at this version on the registry is skipped, so a rerun after a partial
      # failure publishes only what is missing.
      - name: Publish with OIDC
        env:
          DIRECTORIES: ${{ steps.plan.outputs.directories }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          for directory in $DIRECTORIES; do
            name="$(node -p "require('./$directory/package.json').name")"
            if npm view "$name@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "::notice::$name@$VERSION is already on npm; skipping"
              continue
            fi
            npm publish "$RUNNER_TEMP/tarballs/$(basename "$directory").tgz" --access public --provenance
          done
