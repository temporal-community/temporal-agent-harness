name: Client SDK codegen

# typescript/packages/codegen turns `temporal-agent-harness schema` documents into TypeScript
# types. typescript/packages/client commits its output for the event protocol as src/protocol.ts,
# and examples that ship typed clients commit their agent's output (e.g.
# python/examples/tictactoe/client_sdk/). Bazel generates every one of them, and the `bazel test`
# jobs in tests.yml fail when a committed copy differs (each file's `*_up_to_date_test`). These
# jobs test the npm packages themselves, from the pnpm workspace in typescript/.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: client-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-automation:
    name: npm release automation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/npm-release.test.mjs

  packages:
    name: typescript/packages/${{ matrix.package }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [codegen, client, svelte, react]
    defaults:
      run:
        working-directory: typescript/packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      # Before setup-node: `cache: pnpm` needs the pnpm binary. With no `version` input,
      # action-setup reads typescript/package.json's packageManager.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present check
      - run: pnpm test
      - if: matrix.package != 'codegen'
        run: pnpm run build
      # The tic-tac-toe board and the agent DAG studio are written against the Svelte binding and
      # their example's committed generated types, so they are type-checked with them (neither has
      # a build of its own).
      - if: matrix.package == 'svelte'
        working-directory: python/examples/tictactoe/ui
        run: ../../../../typescript/packages/svelte/node_modules/.bin/svelte-check --tsconfig ./tsconfig.json
      - if: matrix.package == 'svelte'
        working-directory: python/examples/agent_dag/ui
        run: ../../../../typescript/packages/svelte/node_modules/.bin/svelte-check --tsconfig ./tsconfig.json
