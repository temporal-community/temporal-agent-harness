name: Client SDK codegen

# packages/codegen turns `temporal-agent-harness schema` documents into TypeScript types.
# packages/client commits its output for the event protocol as src/protocol.ts, and examples
# that ship typed clients commit their agent's output (e.g. examples/tictactoe/client_sdk/). Bazel
# generates every one of them, and the `bazel test` jobs in tests.yml fail when a committed copy
# differs (each file's `*_up_to_date_test`). These jobs test the npm packages themselves.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: client-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-automation:
    name: npm release automation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/npm-release.test.mjs

  codegen:
    name: packages/codegen tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/codegen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/codegen/package-lock.json
      - run: npm ci
      - run: npm test

  client:
    name: packages/client tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/client/package-lock.json
      - run: npm ci
      - run: npm test

  svelte:
    name: packages/svelte tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/client/package-lock.json
            packages/svelte/package-lock.json
      # The binding links ../client, which it resolves through that package's build.
      - name: Build packages/client
        working-directory: packages/client
        run: npm ci && npm run build
      - working-directory: packages/svelte
        run: npm ci
      - working-directory: packages/svelte
        run: npm run check
      - working-directory: packages/svelte
        run: npm test
      - working-directory: packages/svelte
        run: npm run build
      # The tic-tac-toe board and the agent DAG studio are written against the binding and their
      # example's committed generated types, so they are type-checked with them (neither has a
      # build of its own).
      - working-directory: examples/tictactoe/ui
        run: ../../../packages/svelte/node_modules/.bin/svelte-check --tsconfig ./tsconfig.json
      - working-directory: examples/agent_dag/ui
        run: ../../../packages/svelte/node_modules/.bin/svelte-check --tsconfig ./tsconfig.json

  react:
    name: packages/react tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/client/package-lock.json
            packages/react/package-lock.json
      # The binding links ../client, which it resolves through that package's build.
      - name: Build packages/client
        working-directory: packages/client
        run: npm ci && npm run build
      - working-directory: packages/react
        run: npm ci
      # Also type-checks test/TicTacToeBoard.tsx against the example's committed generated types.
      - working-directory: packages/react
        run: npm run check
      - working-directory: packages/react
        run: npm test
      - working-directory: packages/react
        run: npm run build
