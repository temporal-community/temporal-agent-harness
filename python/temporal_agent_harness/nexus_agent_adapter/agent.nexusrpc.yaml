nexusrpc: "1.0.0"

services:
  AgentService:
    fqn: AgentService
    description: "Nexus service that exposes one agent type's sessions to callers in any namespace or SDK language. A caller sends messages with sendAgentMessage, which starts the session if needed, and reads the agent's events with pollMessages."
    operations:
      sendAgentMessage:
        description: "Start the session if it isn't running, then deliver a message to one of the agent's @agent.accepts handlers. msgType is the handler name and payload its input. startConfig and startData apply only when this call starts the session. Mirrors AgentClient.start_and_submit_message(). When the handler rejects mid-turn messages and a turn is open, fails with BAD_REQUEST whose cause is an ApplicationError of type MidTurnRejected."
        input: { $ref: "#/$defs/SendAgentMessageInput" }
        output: { $ref: "#/$defs/SendMessageOutput" }
      approveToolCall:
        description: "Resolve a pending tool-approval gate. The workflow's tool_approval update records the decision; the gated tool call proceeds (or is rejected) immediately."
        input: { $ref: "#/$defs/ApproveToolCallInput" }
        output: { $ref: "#/$defs/ApproveToolCallOutput" }
      queryAgentInterface:
        description: "Return the agent's @agent.accepts handlers: name, description, input and output schemas, and mid-turn behavior. Mirrors AgentClient.get_agent_interface(). Use it to build valid sendAgentMessage payloads."
        input: { $ref: "#/$defs/QuerySessionInput" }
        output: { $ref: "#/$defs/AgentInterfaceOutput" }
      queryAgentStatus:
        description: "Return a snapshot of the session's state: turn counter, whether a turn is open, queued messages, pending approvals and callbacks, subagents, and the approval policy. Mirrors AgentClient.get_status()."
        input: { $ref: "#/$defs/QuerySessionInput" }
        output: { $ref: "#/$defs/AgentStatusOutput" }
      pollMessages:
        description: "Async operation that completes once the agent has published events at or after cursor. Returns a batch of stream items (WorkflowStream PollResult wire format) and the next cursor. Completes synchronously with closed=true when the session has already ended."
        input: { $ref: "#/$defs/PollMessagesInput" }
        output: { $ref: "#/$defs/PollMessagesOutput" }
      provideCallbackResult:
        description: "Fulfill a pending callback tool call (a tool with no worker-side body - an attached client executes it and submits the outcome here). Mirrors AgentClient.provide_callback_result(). Exactly one of result/error should be set."
        input: { $ref: "#/$defs/ProvideCallbackResultInput" }
        output: { $ref: "#/$defs/ProvideCallbackResultOutput" }
      closeSession:
        description: "Send the agent the harness's close signal: it winds down its turn loop and denies any pending approvals and callbacks. Succeeds when the session has already ended."
        input: { $ref: "#/$defs/QuerySessionInput" }
        output: { $ref: "#/$defs/CloseSessionOutput" }

$defs:
  SendAgentMessageInput:
    type: object
    properties:
      sessionId:
        type: string
        description: "Session identifier; the agent's workflow ID is the handler's prefix plus this"
      msgType:
        type: string
        description: "Target @agent.accepts handler name"
      payload:
        type: object
        additionalProperties: true
        description: "The handler's input, matching its parameters schema from queryAgentInterface"
      startConfig:
        $ref: "#/$defs/StartConfig"
      startData:
        type: object
        additionalProperties: true
        description: "The agent's @agent.init data, for an agent that takes it. The agent validates it when the session starts."
    required:
      - sessionId
      - msgType
      - payload
    additionalProperties: false

  StartConfig:
    type: object
    description: "The session's AgentConfig, used only when sendAgentMessage starts the session. Every field is optional; an omitted field takes the agent's default."
    properties:
      approvalPolicy:
        $ref: "#/$defs/ApprovalPolicy"
      autoApprovalCriteria:
        type: object
        additionalProperties: true
        description: "The auto mode rulebook, in the JSON shape of the harness's AutoApprovalCriteria"
      agentId:
        type: string
        description: "The agent's own short ID, stamped on every event it publishes"
      closeAfterIdleSeconds:
        type: number
        description: "Close the session once it has been idle this long"
    additionalProperties: false

  SendMessageOutput:
    type: object
    properties:
      turnNumber:
        type: integer
        description: "The turn this message belongs to: a new turn, or the open turn it joined"
      turnId:
        type: string
        description: "Unique ID for this turn"
      messageId:
        type: string
        description: "This message's ID, stamped on every event its handler's work publishes"
      disposition:
        type: string
        enum: ["opened", "joined", "queued"]
        description: "What the message did to the turn: opened a new one, joined the open one, or queued behind it"
      streamHeadOffset:
        type: integer
        description: "Stream offset when the message was accepted; start the first pollMessages call here to skip earlier turns"
    required:
      - turnNumber
      - turnId
      - messageId
      - disposition
      - streamHeadOffset
    additionalProperties: false

  ApproveToolCallInput:
    type: object
    properties:
      sessionId:
        type: string
        description: "Session identifier"
      toolId:
        type: string
        description: "The tool_id from the tool_approval_requested event"
      approved:
        type: boolean
        description: "True to allow the tool call, false to deny it"
      reason:
        type: string
        description: "Optional note surfaced on the resolution event and, on denial, fed back to the model"
      remember:
        type: boolean
        description: "If true and approved, adds the tool to the session's auto-approve list so it won't be gated again"
    required:
      - sessionId
      - toolId
      - approved
    additionalProperties: false

  ApproveToolCallOutput:
    type: object
    properties:
      toolId:
        type: string
        description: "Echo of the resolved tool ID"
      accepted:
        type: boolean
        description: "Always true on success (the update validator rejects invalid decisions before the handler runs)"
    required:
      - toolId
      - accepted
    additionalProperties: false

  QuerySessionInput:
    type: object
    properties:
      sessionId:
        type: string
        description: "Session identifier"
    required:
      - sessionId
    additionalProperties: false

  AgentInterfaceOutput:
    type: object
    properties:
      handlers:
        type: array
        items:
          $ref: "#/$defs/AcceptedFunction"
        description: "The agent's @agent.accepts handlers, in declaration order"
    required:
      - handlers
    additionalProperties: false

  AcceptedFunction:
    type: object
    description: "One @agent.accepts handler, described tool-style (mirrors the harness's AcceptedFunction)"
    properties:
      name:
        type: string
        description: "Handler name - the value to pass as msgType in sendAgentMessage"
      description:
        type: string
        description: "Handler docstring describing when and how to use it"
      parameters:
        type: object
        additionalProperties: true
        description: "JSON Schema for the handler's input model"
      output:
        type: object
        additionalProperties: true
        description: "JSON Schema for the handler's return model"
      midTurn:
        type: string
        enum: ["enqueue", "reject", "accept"]
        description: "What a message does while a turn is open: enqueue waits, reject refuses it, and accept joins the open turn"
      modelCallable:
        type: boolean
        description: "The handler author's hint that a parent agent's model may call this handler"
    required:
      - name
      - description
      - parameters
      - output
      - midTurn
      - modelCallable
    additionalProperties: false

  AgentStatusOutput:
    type: object
    description: "Mirrors the harness's AgentStatus"
    properties:
      agentId:
        type: string
        description: "This agent's own short ID (stamped on every event it publishes)"
      currentTurn:
        type: integer
        description: "Monotonic turn counter"
      turnActive:
        type: boolean
        description: "True while a turn is open"
      turnParticipants:
        type: integer
        description: "How many messages are running in the open turn; more than 1 when handlers joined it"
      pendingTurns:
        type: array
        items:
          $ref: "#/$defs/PendingTurn"
        description: "Messages queued behind the open turn"
      pendingApprovals:
        type: array
        items:
          $ref: "#/$defs/PendingApproval"
        description: "Gated tool calls awaiting a human decision"
      pendingCallbacks:
        type: array
        items:
          $ref: "#/$defs/PendingCallback"
        description: "Callback tool calls awaiting a client-supplied result"
      subagents:
        type: array
        items:
          $ref: "#/$defs/SubagentInfo"
        description: "Subagents this agent is currently driving"
      approvalPolicy:
        $ref: "#/$defs/ApprovalPolicy"
      hasAutoApprovalEvaluator:
        type: boolean
        description: "Whether the agent has an auto mode evaluator wired"
      closeReason:
        type: string
        enum: ["requested", "idle_timeout_expired"]
        description: "Why the agent closed; absent while it is running"
    required:
      - agentId
      - currentTurn
      - turnActive
      - turnParticipants
      - pendingTurns
      - pendingApprovals
      - pendingCallbacks
      - subagents
      - approvalPolicy
      - hasAutoApprovalEvaluator
    additionalProperties: false

  PendingTurn:
    type: object
    description: "A message queued behind the open turn (mirrors the harness's PendingTurn)"
    properties:
      turnNumber:
        type: integer
      turnId:
        type: string
      messageId:
        type: string
        description: "The queued message's ID, as returned by sendAgentMessage"
      message:
        type: string
        description: "JSON-compacted {type, payload} envelope of the queued message"
    required:
      - turnNumber
      - turnId
      - messageId
      - message
    additionalProperties: false

  PendingApproval:
    type: object
    description: "A gated tool call awaiting a human decision (mirrors the harness's PendingApproval)"
    properties:
      toolId:
        type: string
        description: "ID to pass to approveToolCall"
      shortId:
        type: string
        description: "A short, session-unique alias for toolId, for chat platforms whose button payloads can't hold a provider's tool ID"
      toolName:
        type: string
        description: "Human-readable tool name"
      toolInput:
        type: object
        additionalProperties: true
        description: "The model-facing tool input (injected parameters excluded)"
      turnNumber:
        type: integer
        description: "Turn that triggered this approval request"
    required:
      - toolId
      - shortId
      - toolName
      - toolInput
      - turnNumber
    additionalProperties: false

  PendingCallback:
    type: object
    description: "A callback tool call awaiting a client-supplied result (mirrors the harness's PendingCallback)"
    properties:
      toolId:
        type: string
        description: "ID to pass to provideCallbackResult"
      toolName:
        type: string
        description: "Human-readable tool name"
      toolInput:
        type: object
        additionalProperties: true
        description: "The model-facing tool input (injected parameters excluded)"
      outputSchema:
        type: object
        additionalProperties: true
        description: "JSON Schema the submitted result must match"
      turnNumber:
        type: integer
        description: "Turn that triggered this callback request"
    required:
      - toolId
      - toolName
      - toolInput
      - outputSchema
      - turnNumber
    additionalProperties: false

  SubagentInfo:
    type: object
    description: "A subagent this agent is driving (mirrors the harness's SubagentInfo)"
    properties:
      subagentId:
        type: string
        description: "The short ID this agent references the subagent by"
      agentKey:
        type: string
      workflowId:
        type: string
        description: "The subagent's child workflow ID"
    required:
      - subagentId
      - agentKey
      - workflowId
    additionalProperties: false

  ApprovalPolicy:
    type: object
    description: "Which tool calls skip human approval (mirrors the harness's ToolApprovalPolicy)"
    properties:
      dangerouslySkipAllApprovals:
        type: boolean
        description: "If true, no tool call is ever gated"
      autoApproveInherentlySafe:
        type: boolean
        description: "If true, tools that declared themselves inherently_safe skip the gate"
      autoApproveTools:
        type: array
        items:
          type: string
        uniqueItems: true
        description: "Tool names that skip the gate"
      autoModeEnabled:
        type: boolean
        description: "If true, the agent's auto mode evaluator may approve or deny calls the fields above don't allow"
    required:
      - dangerouslySkipAllApprovals
      - autoApproveInherentlySafe
      - autoApproveTools
      - autoModeEnabled
    additionalProperties: false

  PollMessagesInput:
    type: object
    properties:
      sessionId:
        type: string
        description: "Session identifier"
      cursor:
        type: integer
        description: "Stream offset to read from: streamHeadOffset for a new message, else the previous call's next_offset"
    required:
      - sessionId
      - cursor
    additionalProperties: false

  PollMessagesOutput:
    type: object
    description: "Mirrors WorkflowStream's PollResult wire format, so the poll update's result is the operation's result without transformation."
    properties:
      items:
        type: array
        items:
          $ref: "#/$defs/StreamItem"
        description: "Events published at or after cursor"
      next_offset:
        type: integer
        description: "Cursor for the next pollMessages call"
      more_ready:
        type: boolean
        description: "True when more items are immediately available (the batch was capped)"
      closed:
        type: boolean
        description: "True only when the session had already ended"
    required:
      - items
      - next_offset
      - more_ready
    additionalProperties: false

  StreamItem:
    type: object
    description: "One event the agent published"
    properties:
      topic:
        type: string
        description: "Stream topic name (turn_events)"
      data:
        type: string
        description: "base64 of a serialized Temporal Payload whose data is the event's JSON (the harness's AgentStreamItem)"
      offset:
        type: integer
        description: "Absolute position of this item in the stream"
    required:
      - topic
      - data
      - offset
    additionalProperties: false

  ProvideCallbackResultInput:
    type: object
    description: "Payload for the provideCallbackResult operation. Exactly one of result/error should be set."
    properties:
      sessionId:
        type: string
        description: "Session identifier"
      toolId:
        type: string
        description: "The tool_id from the callback_requested event"
      result:
        type: object
        additionalProperties: true
        description: "The value the client produced. Object-shaped only over this operation - nex-gen's Go target can't compile a oneOf with an object branch (generates a dangling type reference), so a result for a tool whose output schema is not an object is wrapped as {\"value\": ...}."
      error:
        type: string
        description: "Set instead of result when the client could not fulfill the call"
    required:
      - sessionId
      - toolId
    additionalProperties: false

  ProvideCallbackResultOutput:
    type: object
    properties:
      toolId:
        type: string
        description: "Echo of the resolved tool ID"
      accepted:
        type: boolean
        description: "Always true on success (the update validator rejects invalid submissions before the handler runs)"
    required:
      - toolId
      - accepted
    additionalProperties: false

  CloseSessionOutput:
    type: object
    properties:
      alreadyClosed:
        type: boolean
        description: "True when the session had already ended before this call"
    required:
      - alreadyClosed
    additionalProperties: false
