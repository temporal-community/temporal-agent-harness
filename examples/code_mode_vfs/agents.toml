# Registry of agents the Code Mode VFS example UI can launch.

[[agents]]
key = "code-mode-vfs"
workflow_type = "CodeModeVfsAgent"
agent = "examples.code_mode_vfs.workflow:CodeModeVfsAgentWorkflow"
task_queue = "code-mode-vfs"
label = "Code Mode VFS"
description = """
An assistant whose Code Mode scripts work on a virtual filesystem: a read-only /skills
mount of instruction files seeded by an activity, and a writable /workspace. Ask for an
expense report or meeting notes; it reads the matching instructions, follows them in
Python scripts, and writes the result to /workspace."""
