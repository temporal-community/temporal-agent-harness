# Registry of agents the Nexus-hello example UI can launch.
#
# The shared FastAPI server (examples/app.py) reads this file and passes the parsed registry
# into the packaged SessionManagerWorkflow as its workflow init arg. The manager then serves
# it back over the `available_agents` query, so the app server can expose it at /api/agents
# without hardcoding the agent list.

[[agents]]
key = "nexus-hello"
workflow_type = "NexusHelloAgent"
task_queue = "nexus-hello"
label = "Nexus Hello"
description = """
A hello-world OpenAI Agents SDK agent using nexus_tools_gateway() (agent_id inferred
from this workflow_type, "NexusHelloAgent") and nexus_native_mcp_server():

- demo_get_fun_fact (a 3rd-party MCP server, proxied through the Durable Tools Gateway
  -- registered ahead of time under agent_id "NexusHelloAgent")
- demo-nexus_get_lucky_number (a Nexus-native MCP server, reached directly -- no
  gateway, no registration)

Needs `just setup-nexus`, the gateway, both tool services/servers, and `just
register-third-party` run first — see examples/nexus_hello/README.md."""
