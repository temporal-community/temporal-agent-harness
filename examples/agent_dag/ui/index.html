<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Agent DAG Studio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a2030'/%3E%3Cg fill='%238b93ff'%3E%3Ccircle cx='9' cy='11' r='3'/%3E%3Ccircle cx='9' cy='21' r='3'/%3E%3Ccircle cx='23' cy='16' r='3.4'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "svelte": "https://esm.sh/svelte@5.57.1",
          "svelte/": "https://esm.sh/svelte@5.57.1/",
          "@temporalio/agent-harness-svelte": "./harness-svelte/index.js",
          "@temporalio/agent-harness-client": "./harness-client/src/index.js"
        }
      }
    </script>
    <script type="module">
      // svelte-sw.js compiles the .svelte files as they load, once it controls the page.
      await navigator.serviceWorker.register("./svelte-sw.js");
      if (!navigator.serviceWorker.controller) {
        await new Promise((resolve) => navigator.serviceWorker.addEventListener("controllerchange", resolve));
      }
      const [{ mount }, { default: App }] = await Promise.all([import("svelte"), import("./App.svelte")]);
      document.getElementById("boot")?.remove();
      mount(App, { target: document.body });
    </script>
  </head>
  <body>
    <div id="boot">Loading studio…</div>
  </body>
</html>
