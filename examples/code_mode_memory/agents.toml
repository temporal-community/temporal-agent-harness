# Registry of agents the Code Mode memory example UI can launch.

[[agents]]
key = "code-mode-memory"
workflow_type = "CodeModeMemoryAgent"
agent = "examples.code_mode_memory.workflow:CodeModeMemoryAgentWorkflow"
task_queue = "code-mode-memory"
label = "Code Mode Memory"
description = """
An assistant with long-term memory: its Code Mode scripts read and write a /memory mount
backed by activities on a directory of the worker's disk, following a memory skill under
/skills. Start two sessions with the same memory_dir and the second one remembers what
you told the first."""
