[project]
name = "temporal-agent-harness"
version = "0.1.0"
description = "Temporal-native agent harness (experimental) — durable agents on Temporal, with the AI SDKs you already use."
readme = "README.md"
requires-python = ">=3.11"
# Core runtime deps are deliberately minimal: the harness itself only needs Temporal and
# pydantic. AI-SDK and external-storage needs are opt-in extras below, so installing the
# harness doesn't drag in Gemini or boto3.
dependencies = [
    "a2a-sdk>=1.1.2",
    "nexus-a2a",
    "temporalio>=1.31.0",  # provides temporalio.contrib.workflow_streams (experimental)
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The Google Gemini SDK integration: temporal_agent_harness.ai_sdks.google_genai_plugin.
genai = [
    "google-genai>=2.0.0",
    "google-auth>=2.53.0",
]
# S3-backed large-payload offload (temporal_agent_harness.harness.large_payload). The
# default local-filesystem driver needs nothing extra; only the S3 driver needs aioboto3.
s3 = [
    # temporalio's bundled S3 storage driver (temporalio.contrib.aws.s3driver) imports
    # aioboto3 AND types_aiobotocore_s3 at runtime; the [aioboto3] extra pulls both. Bare
    # aioboto3 is not enough to load the driver.
    "temporalio[aioboto3]>=1.31.0",
]
# The OpenAI Agents SDK integration: temporal_agent_harness.ai_sdks.openai_agents
# (vendored from temporalio.contrib.openai_agents @ sdk-python main). The trace interceptor
# imports opentelemetry at module load, so this extra pulls temporalio's opentelemetry extra.
openai-agents = [
    "openai-agents>=0.22.0",
    "mcp>=2.1.1,<3",
    "temporalio[opentelemetry]>=1.31.0",
]
# The Pydantic AI integration: temporal_agent_harness.ai_sdks.pydantic_ai_harness. Unlike the
# openai-agents/genai integrations, the upstream plugin (pydantic_ai.durable_exec.temporal, shipped
# in pydantic-ai-slim[temporal]) is used UNMODIFIED — its first-class `event_stream_handler` hook is
# the streaming seam the harness needs, so there is nothing to vendor and only a thin glue module.
pydantic-ai = [
    "pydantic-ai-slim[temporal]>=2.13",
]
# Packaged FastAPI server and browser UI assets.
ui = [
    "fastapi[standard]>=0.136.3",
]
# Code Mode: the pydantic-monty sandbox that Code Mode runs model-authored scripts in
# (temporal_agent_harness.harness.code_mode). Only the worker-side stepping activities import
# it; the workflow-side factory (agent.code_mode_tool) stays free of this dependency.
code-mode = [
    "pydantic-monty>=0.0.18",
]
# Nexus-brokered MCP servers: temporal_agent_harness.ai_sdks.openai_agents.workflow.
# nexus_brokered_mcp_server. Lets an Agent reach an MCP tool over a Temporal Nexus endpoint,
# one server per Nexus service, passed directly via Agent(mcp_servers=[...]). Needs the
# `openai-agents` extra's deps too (restated here so this extra is self-sufficient), and
# Python >=3.13 (temporal-nexus-mcp's own floor). Only resolvable from an editable checkout of
# this repo — temporal-nexus-mcp isn't published to PyPI.
#
# NOTE: the distribution is named `temporal-nexus-mcp`, NOT `nexus-mcp`. An unrelated
# third-party project already owns `nexus-mcp` on PyPI, so a bare `nexus-mcp` requirement here
# would resolve to that stranger's package for anyone installing outside a checkout of this repo
# (the [tool.uv.sources] path below is workspace-local and does NOT travel in built metadata).
# The extra keeps the short `nexus-mcp` name; only the dependency changed.
nexus-mcp = [
    "temporal-nexus-mcp; python_version >= '3.13'",
    "openai-agents>=0.22.0",
    "mcp>=2.1.1,<3",
    "temporalio[opentelemetry]>=1.31.0",
]

[dependency-groups]
# Everything needed to RUN the bundled Monty example from a checkout. Not part of the
# published package's runtime deps — examples are not shipped.
examples = [
    "google-genai>=2.0.0",
    "google-auth>=2.53.0",
    "pydantic-monty>=0.0.18",  # the Monty sandbox the monty example runs scripts in
    "fastapi[standard]>=0.136.3",  # packaged web app used by the examples; pulls in uvicorn
    "openai-agents>=0.22.0",  # the OpenAI Agents SDK example (examples/openai_hello, examples/react_agent)
    "pydantic-ai-slim[temporal]>=2.13",  # the Pydantic AI example (examples/pydantic_ai_hello)
    "httpx>=0.27",  # the react_agent example's tools call real weather / geo / IP APIs
]
# Test + lint tooling. The full tests/ suite imports both the Gemini SDK (the ai_sdks plugin
# tests) and pydantic-monty (the monty example tests), which live in the `examples` group —
# so dev includes it. uv installs the `dev` group by default, so a plain `uv run pytest`
# has everything the whole suite under tests/ needs.
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "setuptools>=83.0.0",  # package artifact tests call the build backend directly
    "moto[server]>=5.2.1",  # threaded S3 mock for the utils/large_payload S3-driver test
    "temporalio[aioboto3]>=1.31.0",  # S3 storage driver under test (mirrors the `s3` extra)
    # OpenAI Agents integration + its opentelemetry/mcp deps, so the vendored plugin and its
    # tests import under a plain `uv run pytest` (mirrors the `openai-agents` extra).
    "openai-agents>=0.22.0",
    "mcp>=2.1.1,<3",
    "temporalio[opentelemetry]>=1.31.0",
    # Pydantic AI integration (the ai_sdks glue + its tests) — mirrors the `pydantic-ai` extra.
    "pydantic-ai-slim[temporal]>=2.13",
    # Nexus-brokered MCP server tests — only on Python >=3.13, temporal-nexus-mcp's own floor,
    # so `uv sync`/`pytest` on older Pythons just skip it.
    "temporal-nexus-mcp; python_version >= '3.13'",
    { include-group = "examples" },
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Ship only the package; examples/, tests/, and docs/ stay out of the wheel.
include = ["temporal_agent_harness*"]

[tool.setuptools.package-data]
"temporal_agent_harness.ui" = [
    "dist/*",
    "dist/assets/*",
]

[tool.uv.sources]
nexus-a2a = { path = "nexus/a2a", editable = true }
temporal-nexus-mcp = { path = "nexus/mcp", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
# All tests live under tests/, mirroring the layout of the code they exercise: tests/harness
# + tests/ai_sdks for the package, tests/examples/monty for the bundled example. The example
# tests import the example by absolute path (examples.monty.*), so put the repo root on
# sys.path — the editable install only exposes the package, not the (unshipped) examples.
testpaths = ["tests"]
pythonpath = ["."]
