nexusrpc: "1.0.0"

services:
  RegistryService:
    fqn: RegistryService
    description: >
      Durable Tools Gateway. Registers 3rd-party MCP servers under an agent_id, and
      proxies calls to them. Native Nexus services are reached directly by the agent
      and never go through this gateway.
    operations:
      registerExternal:
        description: Register a 3rd-party MCP server under one agent_id.
        input: { $ref: "#/$defs/RegisterExternalInput" }
      deregister:
        description: Remove one registration under one agent_id.
        input: { $ref: "#/$defs/DeregisterInput" }
      listAgentEntries:
        description: All registered 3rd-party tools for one agent_id.
        input: { $ref: "#/$defs/ListAgentEntriesInput" }
        output: { $ref: "#/$defs/ListAgentEntriesOutput" }
      callTool:
        fqn: call_tool
        description: Invoke one tool on a registered 3rd-party MCP server.
        input: { $ref: "#/$defs/CallToolInput" }
        output: { $ref: "#/$defs/CallToolOutput" }
      registerSubagent:
        fqn: register_subagent
        description: Register a non-Nexus subagent's URL under one agent_id.
        input: { $ref: "#/$defs/RegisterSubagentInput" }
      deregisterSubagent:
        fqn: deregister_subagent
        description: Remove one subagent registration under one agent_id.
        input: { $ref: "#/$defs/DeregisterSubagentInput" }
      startSubagent:
        fqn: start_subagent
        description: Start one instance from a registered subagent provider.
        input: { $ref: "#/$defs/StartSubagentInput" }
        output: { $ref: "#/$defs/StartSubagentOutput" }
      dispatchSubagentTurn:
        fqn: dispatch_subagent_turn
        description: Send one turn to a subagent instance and return its reply.
        input: { $ref: "#/$defs/DispatchSubagentTurnInput" }
        output: { $ref: "#/$defs/DispatchSubagentTurnOutput" }
      stopSubagent:
        fqn: stop_subagent
        description: Close a subagent instance.
        input: { $ref: "#/$defs/StopSubagentInput" }

$defs:
  RegisterExternalInput:
    type: object
    description: Input for registering a 3rd-party MCP server.
    properties:
      agent_id:
        type: string
      name:
        type: string
      url:
        type: string

  DeregisterInput:
    type: object
    description: Input for removing one registration.
    properties:
      agent_id:
        type: string
      name:
        type: string

  ListAgentEntriesInput:
    type: object
    description: Input for looking up one agent_id's registrations.
    properties:
      agent_id:
        type: string

  ListAgentEntriesOutput:
    type: object
    description: All registered 3rd-party tools for one agent_id.
    properties:
      remote_tools:
        type: object
        description: "{alias: [tool dicts]}"
        additionalProperties:
          type: array
          items:
            type: object
            additionalProperties: true

  CallToolInput:
    type: object
    description: Input for invoking one tool on a registered 3rd-party MCP server.
    properties:
      agent_id:
        type: string
      alias:
        type: string
      name:
        type: string
        description: Full prefixed tool name, e.g. "weather_get_forecast".
      arguments:
        type: object
        additionalProperties: true

  CallToolOutput:
    type: object
    description: Serialised mcp.types.CallToolResult.
    properties:
      result:
        type: object
        additionalProperties: true

  RegisterSubagentInput:
    type: object
    description: Input for registering a non-Nexus subagent's URL.
    properties:
      agent_id:
        type: string
      alias:
        type: string
      url:
        type: string
    required: [agent_id, alias, url]
    additionalProperties: false

  DeregisterSubagentInput:
    type: object
    description: Input for removing one subagent registration.
    properties:
      agent_id:
        type: string
      alias:
        type: string
    required: [agent_id, alias]
    additionalProperties: false

  StartSubagentInput:
    type: object
    description: Input for starting one subagent instance.
    properties:
      agent_id:
        type: string
      alias:
        type: string
    required: [agent_id, alias]
    additionalProperties: false

  StartSubagentOutput:
    type: object
    description: A new subagent instance.
    properties:
      instance_id:
        type: string
    required: [instance_id]
    additionalProperties: false

  DispatchSubagentTurnInput:
    type: object
    description: Input for sending one turn to a subagent instance.
    properties:
      agent_id:
        type: string
      instance_id:
        type: string
        description: Instance returned by startSubagent.
      msg_type:
        type: string
        description: Name of the target handler on the subagent.
      payload:
        type: string
        description: JSON-encoded input for msg_type.
      expected_turn:
        type: integer
        description: Caller-known next turn number.
    required: [agent_id, instance_id, msg_type, payload, expected_turn]
    additionalProperties: false

  DispatchSubagentTurnOutput:
    type: object
    description: The subagent's reply to one turn.
    properties:
      output:
        type: string
        description: JSON-encoded reply.
      turn_id:
        type: string
      turn_number:
        type: integer
    required: [output, turn_id, turn_number]
    additionalProperties: false

  StopSubagentInput:
    type: object
    description: Input for closing a subagent instance.
    properties:
      agent_id:
        type: string
      instance_id:
        type: string
        description: Instance returned by startSubagent.
    required: [agent_id, instance_id]
    additionalProperties: false
