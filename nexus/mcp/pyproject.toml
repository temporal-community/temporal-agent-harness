[project]
# An unrelated project owns the `nexus-mcp` distribution name on PyPI. This
# distribution uses `temporal-nexus-mcp`. The root project uses `nexus-mcp` only
# as an optional extra name and maps this distribution to the local path.
# Do not add a bare `nexus-mcp` requirement. It installs the unrelated project.
# The unrelated distribution also uses the `nexus_mcp` import name. Do not
# install both distributions in one environment.
name = "temporal-nexus-mcp"
version = "0.1.0"
description = "Bridge MCP tools with Temporal's reliable workflow execution via Nexus RPC"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.1.2",
    "anyio>=4.0.0",
    "fastapi>=0.136.3",
    "mcp>=2.1.1,<3",
    "httpx>=0.27.0",
    "nexus-a2a",
    "nexus-rpc>=1.1.0",
    "pydantic>=2.0",
    "temporalio>=1.15.0",
    "uvicorn>=0.41.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
nexus-a2a = { path = "../a2a", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]
