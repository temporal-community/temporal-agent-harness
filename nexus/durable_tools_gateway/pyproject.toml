[project]
name = "durable-tools-gateway"
version = "0.1.0"
description = "MCP Streamable HTTP entry point for the durable tool call gateway"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.13.0",
    "nexus-mcp",
    "starlette>=0.40.0",
    "temporal-agent-harness",
    "temporalio>=1.15.0",
    "uvicorn>=0.30.0",
]

[tool.uv.sources]
nexus-mcp = { path = "nexus_mcp", editable = true }
# Same-repo path, not a remote pin. A hardcoded branch here breaks any
# consumer pinning temporal-agent-harness to a different branch.
temporal-agent-harness = { path = "../..", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server*"]
