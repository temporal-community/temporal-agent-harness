[project]
name = "subagent-gateway"
version = "0.1.0"
description = "Inbound A2A gateway: fronts one harness subagent (via the agent registry) as a real A2A HTTP+JSON-RPC(+SSE) endpoint, for external non-Temporal A2A clients. Temporal-to-Temporal callers should use nexus/subagents' NexusTransport directly instead."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn>=0.30",
    "subagents",
    "temporal-agent-harness",
    "temporalio>=1.27.2",
    "pydantic>=2.0",
]

[tool.uv.sources]
subagents = { path = "../subagents", editable = true }
temporal-agent-harness = { path = "../..", editable = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["subagent_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
]
