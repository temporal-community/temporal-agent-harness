[project]
name = "sdlc-builder"
version = "0.1.0"
description = "boltzmann: a local development app powered by Temporal Agent Harness"
requires-python = ">=3.11"
dependencies = [
  "temporal-agent-harness[ui,openai-agents,code-mode]==0.4.0",
  # Retained only for replay/resumption of tasks created before the SDK integration.
  "pydantic-ai-slim[openai,anthropic]==2.14.1",
  # This Pydantic AI release uses httpx; Anthropic 1.x switched to httpx2.
  "anthropic==0.108.0",
  "keyring>=25.6,<26",
]

[project.scripts]
sdlc = "sdlc_builder.cli:main"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1", "httpx>=0.28", "ruff>=0.12", "jsonpatch>=1.33"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_builder"]

[tool.hatch.build.targets.wheel.force-include]
"src/sdlc_builder/static" = "sdlc_builder/static"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
